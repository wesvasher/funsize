name: FunSize
options:
  bundleIdPrefix: com.wesvasher
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FunSize:
    type: application
    platform: macOS
    sources: [FunSize]
    entitlements:
      path: FunSize/FunSize.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.assets.movies.read-write: true
        # Lets the system download Apple's 4x enhancement model.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesvasher.FunSize
        SWIFT_OBJC_BRIDGING_HEADER: FunSize/FunSize-Bridging-Header.h
        # Only C code (the per-frame deinterlace loop) is affected; keep it fast in debug builds.
        GCC_OPTIMIZATION_LEVEL: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FunSize
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  FunSizeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FunSizeTests]
    dependencies:
      - target: FunSize
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FunSize:
    build:
      targets:
        FunSize: all
    test:
      targets: [FunSizeTests]
