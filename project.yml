name: FunSize
options:
  bundleIdPrefix: com.wesvasher
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FunSize:
    type: application
    platform: macOS
    sources: [FunSize]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesvasher.FunSize
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FunSize
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  FunSizeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FunSizeTests]
    dependencies:
      - target: FunSize
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FunSize:
    build:
      targets:
        FunSize: all
    test:
      targets: [FunSizeTests]
