name: SwiftCut
options:
  bundleIdPrefix: com.wesvasher
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  SwiftCut:
    type: application
    platform: macOS
    sources:
      - path: SwiftCut
        excludes: ["Resources/Help/**"]
      # Help articles, kept as a folder in the app (Help/*.md).
      - path: SwiftCut/Resources/Help
        type: folder
        buildPhase: resources
    info:
      path: SwiftCut/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: SwiftCut Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.wesvasher.swiftcut.project]
          # Projects saved before the app was renamed from FunSize.
          - CFBundleTypeName: FunSize Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.wesvasher.funsize.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.wesvasher.swiftcut.project
            UTTypeDescription: SwiftCut Project
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [swiftcut]
          - UTTypeIdentifier: com.wesvasher.swiftcut.presets
            UTTypeDescription: SwiftCut Export Presets
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [swiftcutpresets]
        # Files from before the app was renamed from FunSize. Still opened, never written.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.wesvasher.funsize.project
            UTTypeDescription: FunSize Project
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [funsize]
          - UTTypeIdentifier: com.wesvasher.funsize.presets
            UTTypeDescription: FunSize Export Presets
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [funsizepresets]
    entitlements:
      path: SwiftCut/SwiftCut.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.assets.movies.read-write: true
        # Lets the system download Apple's 4x enhancement model.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesvasher.SwiftCut
        SWIFT_OBJC_BRIDGING_HEADER: SwiftCut/SwiftCut-Bridging-Header.h
        # Only C code (the per-frame deinterlace loop) is affected; keep it fast in debug builds.
        GCC_OPTIMIZATION_LEVEL: "3"
        # The app is run from Debug builds; optimize Swift too so color math and frame work stay fast.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwiftCut
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
      configs:
        # Needed only for distribution. In optimized local builds it stops the tests from loading.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
  SwiftCutTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SwiftCutTests]
    dependencies:
      - target: SwiftCut
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Signed like the app, or the hardened app refuses to load the tests.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  SwiftCut:
    build:
      targets:
        SwiftCut: all
    test:
      targets: [SwiftCutTests]
